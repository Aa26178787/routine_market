<nav class="category-strip" aria-label="운동 분야">{% for category in categories %}<a href="{% url 'products:list' %}?category={{ category.slug|urlencode }}"><span class="category-icon color-{{ forloop.counter0 }}">{% include 'shared/icon.html' with name=category.slug %}</span><strong>{{ category.name }}</strong><small>{{ category.description|default:'나에게 맞는 운동'|truncatechars:18 }}</small></a>{% endfor %}</nav>
